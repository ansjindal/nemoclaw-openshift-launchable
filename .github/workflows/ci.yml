name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles the Next.js workshop site — typechecks TS and parses every MDX lesson (a broken
  # component/diagram reference or TS error fails here).
  web-build:
    name: Web build (TS + MDX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Shell syntax for the provisioning phases (shellcheck is preinstalled on ubuntu runners).
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=error --external-sources scripts/*.sh scripts/lib/*.sh

  # YAML syntax for manifests, helm values, and policies (multi-doc aware).
  yaml-syntax:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, glob, yaml
          files = sorted(set(
              glob.glob("manifests/**/*.yaml", recursive=True)
              + glob.glob("policies/**/*.yaml", recursive=True)
              + glob.glob("helm/**/*.yaml", recursive=True)
          ))
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as e:
                  print(f"✗ {f}: {e}"); bad += 1
          if bad:
              sys.exit(f"{bad} invalid YAML file(s)")
          print(f"✓ {len(files)} YAML files valid")
          PY
